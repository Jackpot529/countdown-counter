<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Countdown Counter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f2f2;
      padding: 40px;
    }
    h1 {
      font-size: 2em;
      margin-bottom: 20px;
    }
    #count {
      font-size: 5em;
      color: #333;
    }
    button {
      font-size: 1.2em;
      margin: 10px;
      padding: 10px 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>📘 Problems Left</h1>
  <div id="count">80</div>

  <button onclick="decrease()">−1</button>
  <button onclick="reset()">Reset</button>

  <script>
    // Load count from localStorage or set to 80
    let count = localStorage.getItem('count') ? parseInt(localStorage.getItem('count')) : 80;
    const countDisplay = document.getElementById('count');

    function updateDisplay() {
      countDisplay.textContent = count;
      localStorage.setItem('count', count);
    }

    function decrease() {
      if (count > 0) {
        count--;
        updateDisplay();
      }
    }

    function reset() {
      count = 80;
      updateDisplay();
    }

    // Initialize display
    updateDisplay();
  </script>

</body>
</html>
