<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Problem Counter</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      padding: 40px;
    }

    h1 {
      font-size: 2em;
      margin-bottom: 20px;
    }

    #count {
      font-size: 5em;
      margin-bottom: 20px;
      color: #00ffcc;
    }

    input[type="number"] {
      font-size: 1.2em;
      padding: 5px 10px;
      width: 100px;
      text-align: center;
      margin-bottom: 10px;
    }

    button {
      font-size: 1.1em;
      margin: 10px 5px;
      padding: 10px 20px;
      cursor: pointer;
      background-color: #00ffcc;
      border: none;
      border-radius: 5px;
      color: #000;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #00ddb3;
    }
  </style>
</head>
<body>

  <h1>📘 Problems Left</h1>

  <div id="count">80</div>

  <div>
    <input type="number" id="startNumber" placeholder="Set number" />
    <button onclick="setCount()">Set</button>
  </div>

  <button onclick="decrease()">−1</button>
  <button onclick="reset()">Reset</button>

  <script>
    // Initialize count from localStorage or default
    let count = localStorage.getItem('count') ? parseInt(localStorage.getItem('count')) : 80;
    const countDisplay = document.getElementById('count');

    function updateDisplay() {
      countDisplay.textContent = count;
      localStorage.setItem('count', count);
    }

    function decrease() {
      if (count > 0) {
        count--;
        updateDisplay();
      }
    }

    function reset() {
      count = 80;
      updateDisplay();
    }

    function setCount() {
      const input = document.getElementById('startNumber').value;
      const newCount = parseInt(input);
      if (!isNaN(newCount) && newCount >= 0) {
        count = newCount;
        updateDisplay();
      } else {
        alert("Please enter a valid number.");
      }
    }

    // Display initial count
    updateDisplay();
  </script>

</body>
</html>
